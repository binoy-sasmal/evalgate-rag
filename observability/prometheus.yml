global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    # Keep the labels the collector derived from the OTLP resource
    # (job = service.name) instead of overwriting them with this scrape job's.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
