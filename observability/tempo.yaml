# Single-binary Tempo with local, ephemeral storage: traces live in the
# container's /tmp and are gone when it is removed. Enough for a local stack.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
