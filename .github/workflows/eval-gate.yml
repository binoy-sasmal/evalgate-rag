name: Eval Gate

# Runs the full RAG pipeline over the golden set and fails the build if any
# Ragas metric regresses beyond tolerance vs eval/baseline.json.
#
# Costs real LLM tokens, so it runs on:
#   - pushes to main
#   - PRs labelled `run-eval`
#   - manual dispatch
# Requires repository secret: LLM_API_KEY.

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

jobs:
  eval:
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-eval')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev,eval]

      - name: Restore cached corpus
        id: corpus-cache
        uses: actions/cache@v4
        with:
          path: data/corpus
          key: eu-ai-act-corpus-v1

      - name: Fetch corpus (cache miss)
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_corpus.py

      - name: Ingest corpus into pgvector
        env:
          DB__HOST: localhost
          EMBEDDING__PROVIDER: openai
          EMBEDDING__API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/ingest.py --strategy recursive

      - name: Run Ragas evaluation
        env:
          DB__HOST: localhost
          LLM__API_KEY: ${{ secrets.LLM_API_KEY }}
          EMBEDDING__API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python eval/run_eval.py --out eval/results.json

      - name: Eval gate — fail on regression
        run: python eval/check_regression.py

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results.json
