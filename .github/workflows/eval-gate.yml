name: Eval Gate

# Runs the full RAG pipeline over the golden set and fails the build if any
# Ragas metric regresses beyond tolerance vs eval/baseline.json.
#
# Costs real LLM tokens, so it runs on:
#   - pushes to main
#   - PRs labelled `run-eval`
#   - manual dispatch
# Requires repository secret: LLM_API_KEY.

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

jobs:
  eval:
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-eval')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev,eval,embed-local]

      # The corpus is committed to the repo (data/corpus/), so it arrives with
      # checkout -- no live fetch. EUR-Lex's WAF blocks fetch_corpus.py from CI
      # runners, and the corpus is the fixed substrate the eval baseline is
      # measured against, so it must be a stable versioned artifact. Refresh it
      # locally with scripts/fetch_corpus.py when the Act is amended.
      - name: Ingest corpus into pgvector
        env:
          DB__HOST: localhost
          EMBEDDING__PROVIDER: fastembed
        run: python scripts/ingest.py --strategy recursive

      # Restores the most recent eval/.cache/ (generated answers + judge
      # scores) so a run that gets cut short by Groq's daily token quota
      # doesn't lose that progress -- the next triggered run picks up where
      # it left off, same as re-running the script locally. Always saves
      # under a fresh key (run_eval.py's own fingerprint check guards
      # against reusing stale cache across a real prompt/model/config
      # change, same as it does locally).
      # Prefix bumped v1 -> v2 to abandon the earlier lineage: it accumulated
      # judge scores/answers produced against an EMPTY store (a broken corpus
      # fetch), and run_eval's fingerprint can't see corpus/store state, so
      # those poisoned entries would otherwise be restored as "valid" and
      # replayed. v2 starts clean against the now-committed corpus.
      - name: Restore eval progress cache
        uses: actions/cache@v4
        with:
          path: eval/.cache
          key: eval-progress-v2-${{ github.run_id }}
          restore-keys: |
            eval-progress-v2-

      - name: Run Ragas evaluation
        env:
          DB__HOST: localhost
          LLM__API_KEY: ${{ secrets.LLM_API_KEY }}
          EMBEDDING__PROVIDER: fastembed
        run: python eval/run_eval.py --out eval/results.json

      - name: Eval gate — fail on regression
        run: python eval/check_regression.py

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results.json
