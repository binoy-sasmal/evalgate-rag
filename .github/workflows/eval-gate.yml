name: Eval Gate

# Runs the full RAG pipeline over the golden set and fails the build if any
# Ragas metric regresses beyond tolerance vs eval/baseline.json.
#
# Costs real LLM tokens, so it runs on:
#   - pushes to main
#   - PRs labelled `run-eval`
#   - manual dispatch
# Requires repository secret: LLM_API_KEY.

# TEMPORARY: the push-to-main trigger is disabled.
#
# Groq decommissioned llama-3.3-70b-versatile (404 model_not_found), which was
# this project's default model and the model eval/baseline.json was measured
# on. The default is now qwen/qwen3.8-27b, but scores are NOT comparable across
# a model swap, so the committed baseline is orphaned and every gated run would
# fail for a reason the gate was never meant to detect.
#
# Restore the block below once a full-sample run on the new model has been
# reviewed and promoted (`python eval/check_regression.py --promote`):
#
#   push:
#     branches: [main]
#     paths-ignore:            # docs-only pushes can't move a metric
#       - '**/*.md'
#       - 'assets/**'
#       - 'LICENSE'
#
# No threshold is relaxed and eval/baseline.json is untouched; the gate still
# runs on demand and on any PR labelled `run-eval`, which is how the
# re-baselining run itself should be driven.
on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

jobs:
  eval:
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-eval')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev,eval,embed-local]

      # The corpus is committed to the repo (data/corpus/), so it arrives with
      # checkout -- no live fetch. EUR-Lex's WAF blocks fetch_corpus.py from CI
      # runners, and the corpus is the fixed substrate the eval baseline is
      # measured against, so it must be a stable versioned artifact. Refresh it
      # locally with scripts/fetch_corpus.py when the Act is amended.
      - name: Ingest corpus into pgvector
        env:
          DB__HOST: localhost
          EMBEDDING__PROVIDER: fastembed
        run: python scripts/ingest.py --strategy recursive

      # Restores the most recent eval/.cache/ (generated answers + judge
      # scores) so a run cut short by Groq's daily token quota doesn't lose
      # that progress -- the next triggered run picks up where it left off,
      # same as re-running the script locally. This is essential, not just an
      # optimisation: a grounded eval over the full golden set carries a real
      # AI Act article as context in every judge call, so it can't finish
      # inside a single day's token budget -- it MUST accumulate across runs.
      #
      # restore/save are split deliberately. The all-in-one actions/cache@v4
      # only saves in a post step gated by `post-if: success()`, and this job
      # fails on every regression/partial (its whole purpose), so that save
      # NEVER ran -- each run silently restarted from scratch. The explicit
      # save step below runs `if: always()` so a failing gate still persists
      # the scores this run produced. Key is per-run-id (unique, so save never
      # collides); restore-keys picks the newest prior cache. run_eval.py's
      # own fingerprint check still guards against reusing stale cache across a
      # prompt/model/config change.
      #
      # Prefix v2 abandons the v1 lineage, which had accumulated scores/answers
      # produced against an EMPTY store (the broken corpus fetch); the
      # fingerprint can't see store state, so those would replay as "valid".
      - name: Restore eval progress cache
        uses: actions/cache/restore@v4
        with:
          path: eval/.cache
          key: eval-progress-v2-${{ github.run_id }}
          restore-keys: |
            eval-progress-v2-

      - name: Run Ragas evaluation
        env:
          DB__HOST: localhost
          LLM__API_KEY: ${{ secrets.LLM_API_KEY }}
          EMBEDDING__PROVIDER: fastembed
        run: python eval/run_eval.py --out eval/results.json

      # Must run even when run_eval or the gate below fails, or a quota-starved
      # partial run's progress is lost -- the exact bug that kept us from ever
      # reaching a full sample. See the restore-step comment.
      - name: Save eval progress cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: eval/.cache
          key: eval-progress-v2-${{ github.run_id }}

      - name: Eval gate — fail on regression
        run: python eval/check_regression.py

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results.json
