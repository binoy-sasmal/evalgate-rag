# Local development stack.
#
#   docker compose up -d db                 # just Postgres/pgvector
#   docker compose up -d                    # + the API
#   docker compose --profile tracing up -d  # + self-hosted Langfuse (v2, single container)
#   TELEMETRY__ENABLED=true docker compose --profile observability up -d
#                                           # + OpenTelemetry Collector, Prometheus, Tempo, Grafana
#
# Langfuse note: v2 runs as one container against Postgres (perfect for a demo).
# Langfuse v3 needs ClickHouse/Redis/MinIO — use their official compose if you
# want v3: https://langfuse.com/self-hosting/docker-compose

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB__HOST: db
      DB__PORT: "5432"
      DB__USER: rag
      DB__PASSWORD: rag
      DB__NAME: rag
      LLM__BASE_URL: ${LLM__BASE_URL:-https://api.groq.com/openai/v1}
      LLM__API_KEY: ${LLM__API_KEY:?set in .env}
      LLM__MODEL: ${LLM__MODEL:-qwen/qwen3.8-27b}
      EMBEDDING__PROVIDER: ${EMBEDDING__PROVIDER:-fastembed}
      EMBEDDING__API_KEY: ${EMBEDDING__API_KEY:-${LLM__API_KEY:-}}
      LANGFUSE__ENABLED: ${LANGFUSE__ENABLED:-false}
      LANGFUSE__HOST: http://langfuse:3000
      LANGFUSE__PUBLIC_KEY: ${LANGFUSE__PUBLIC_KEY:-}
      LANGFUSE__SECRET_KEY: ${LANGFUSE__SECRET_KEY:-}
      TELEMETRY__ENABLED: ${TELEMETRY__ENABLED:-false}
      TELEMETRY__OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8000:8000"

  # ---- optional tracing profile -----------------------------------------
  langfuse-db:
    profiles: ["tracing"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - lfdata:/var/lib/postgresql/data

  langfuse:
    profiles: ["tracing"]
    image: langfuse/langfuse:2
    depends_on:
      - langfuse-db
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: changeme-nextauth-secret
      SALT: changeme-salt
      # Must be a real 64-char hex key (openssl rand -hex 32); Langfuse v2
      # rejects the all-zeros placeholder. Local demo key — fine to commit.
      ENCRYPTION_KEY: 13b37b950950e940696a062ed523f3ca03ffedb3a500c49c195ba685bb0cd644
    ports:
      - "3000:3000"

  # ---- optional observability profile -----------------------------------
  # API --OTLP--> collector --> Tempo (traces) and Prometheus (metrics),
  # both read by Grafana on http://localhost:3001 (3000 is Langfuse's).
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318" # OTLP/HTTP, for an API run on the host instead of in compose

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.4.0
    depends_on:
      - prometheus
      - tempo
    environment:
      # Local demo only: no login, anonymous admin. Never expose this port.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"

volumes:
  pgdata:
  lfdata:
