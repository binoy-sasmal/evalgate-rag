[project]
name = "evalgate-rag"
version = "0.1.0"
description = "Eval-gated hybrid RAG service over the EU AI Act — FastAPI + pgvector + Langfuse + Ragas, with a CI gate that fails on metric regression"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "beautifulsoup4>=4.12",
    # Pin to v2: the Tracer uses the v2 SDK API (langfuse.trace(...)/.span/
    # .generation), which v3+ removed, and the self-hosted server in
    # docker-compose is Langfuse v2 (v3 SDK needs a v3 server w/ ClickHouse).
    # SDK major must match the server major.
    "langfuse>=2.53,<3",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.2.6,<0.3",
    "langchain-openai>=0.2,<0.3",
    "langchain-community>=0.3,<0.4",  # ragas 0.2.x's LLM factory imports from here
    "datasets>=2.20",
]
embed-local = [
    # Exact-pinned: the eval gate compares scores against a stored baseline
    # over time, so the embedding model's numerical output has to be stable
    # run-to-run. fastembed itself is version-stable here, but its inference
    # engine (onnxruntime) isn't -- an unpinned resolve went from 1.18.1 to
    # 1.28.0 between when the baseline was set and a CI run days later,
    # which is enough to shift retrieval and, through it, judged scores like
    # faithfulness without any change to our code, prompts, or retrieval logic.
    "fastembed==0.8.0",        # ONNX BGE embeddings, no torch needed
    "onnxruntime==1.18.1",     # fastembed's inference engine -- pin transitively too
]
ui = [
    "streamlit>=1.36",         # demo UI client; reuses core httpx for API calls
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    # Minor-bounded: ruff holds formatter output stable within a minor but not
    # across one, so an unpinned `>=` lets CI red the build on code nobody
    # touched. 0.16 did exactly that -- it began formatting Python code blocks
    # inside Markdown, so a docs-only commit failed `ruff format --check .`
    # against a CI-resolved 0.16 while a local 0.15 still reported clean.
    # Bump the bound deliberately, so the reformat lands in its own reviewed diff.
    "ruff>=0.16,<0.17",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"  # matches CI/Docker's interpreter; newer numpy stubs need 3.12+ syntax
strict = false
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalgate_rag"]
